version: "3"
services:
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fukhara
      POSTGRES_PASSWORD: fukhara
    ports:
      - 5432:5432
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: fukhara
      MONGO_INITDB_ROOT_PASSWORD: fukhara
    ports:
      - 27017:27017
  mongo-express:
    image: mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: fukhara
      ME_CONFIG_MONGODB_ADMINPASSWORD: fukhara
      ME_CONFIG_BASICAUTH_USERNAME: fukhara
      ME_CONFIG_BASICAUTH_PASSWORD: fukhara
      ME_CONFIG_MONGODB_URL: mongodb://fukhara:fukhara@mongo:27017/
    ports:
      - 8081:8081
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1000m -Xmx1000m
      - ELASTIC_PASSWORD=fukhara
    ports:
      - 9200:9200
      - 9300:9300
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=fukhara
    depends_on:
      - elasticsearch
    ports:
      - 5601:5601
  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    environment:
      MOBSF_API_ONLY: 0
      MOBSF_API_KEY: 515d3578262a2539cd13b5b9946fe17e350c321b91faeb1ee56095430242a4a9
    ports:
      - 8181:8000
